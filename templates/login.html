<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />

    <title>Aims - Login Page</title>
    <meta content="" name="description" />
    <meta content="" name="keywords" />

    <!-- Favicons -->
    <link href="../static/assets/img/favicon.png" rel="icon" />
    <link
      href="../static/assets/img/apple-touch-icon.png"
      rel="apple-touch-icon"
    />

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css?family=Open+Sans:300,300i,400,400i,600,600i,700,700i|Montserrat:300,400,500,600,700"
      rel="stylesheet"
    />

    <!-- Vendor CSS Files -->
    <link href="../static/assets/vendor/aos/aos.css" rel="stylesheet" />
    <link
      href="../static/assets/vendor/bootstrap/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="../static/assets/vendor/bootstrap-icons/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link
      href="../static/assets/vendor/glightbox/css/glightbox.min.css"
      rel="stylesheet"
    />
    <link
      href="../static/assets/vendor/swiper/swiper-bundle.min.css"
      rel="stylesheet"
    />

    <!-- Template Main CSS File -->
    <link href="../static/assets/css/style.css" rel="stylesheet" />
  </head>
</html>

<body>
  <!-- ======= Header ======= -->
  <div>
    <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
      <div class="container-fluid">
        <a class="navbar-brand AIMS">
          AIMS :: Academic Information Management System
        </a>
      </div>
    </nav>
  </div>
  <!-- End Header -->

  <section class="vh-100" style="background-color: #ffffff">
   
    <div class="container py-5 h-100">
      <div class="row d-flex justify-content-center align-items-center h-100">
        <div class="col-12 col-md-7 col-lg-6 col-xl-5">
          <div
            class="card shadow-lg"
            style="
              background-color: #212529;
              color: #ffffff;
              padding: 30px;
              border-radius: 15px;
              width: 100%;
            "
          >
            <div class="card-body">
              <h3
                class="mb-4 text-center"
                style="font-family: 'Montserrat', sans-serif; font-weight: 600"
              >
                Welcome Back!
              </h3>
              <form action="/process_login" method="post">
                <div class="msg">{{ msg }}</div>
                <div class="form-outline mb-3">
                  <label class="form-label" for="email"
                    >Email <span class="text-danger">*</span></label
                  >
                  <input
                    type="text"
                    id="typeEmailX-2"
                    name="username"
                    class="form-control form-control-lg"
                    placeholder="Email id"
                    required
                  />
                </div>
                <div class="d-flex justify-content-center">
                  <button
                    class="btn btn-secondary btn-md rounded-pill px-4"
                    type="submit"
                  >
                    Log in
                  </button>
                </div>
              </form>
              <hr class="my-4 border-secondary-subtle" />
              <a href="signup_main" class="link-light d-block text-center"
                >Create new account</a
              >
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
</body>
