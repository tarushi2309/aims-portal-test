<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />

    <title>Aims - Login Page</title>
    <meta content="" name="description" />
    <meta content="" name="keywords" />

    <!-- Favicons -->
    <link href="../static/assets/img/favicon.png" rel="icon" />
    <link
      href="../static/assets/img/apple-touch-icon.png"
      rel="apple-touch-icon"
    />

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css?family=Open+Sans:300,300i,400,400i,600,600i,700,700i|Montserrat:300,400,500,600,700"
      rel="stylesheet"
    />

    <!-- Vendor CSS Files -->
    <link href="../static/assets/vendor/aos/aos.css" rel="stylesheet" />
    <link
      href="../static/assets/vendor/bootstrap/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="../static/assets/vendor/bootstrap-icons/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link
      href="../static/assets/vendor/glightbox/css/glightbox.min.css"
      rel="stylesheet"
    />
    <link
      href="../static/assets/vendor/swiper/swiper-bundle.min.css"
      rel="stylesheet"
    />

    <!-- Template Main CSS File -->
    <link href="../static/assets/css/style.css" rel="stylesheet" />
  </head>



<body class="bg-light"> 
    <!-- ======= Header ======= -->
    <div>
        <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand AIMS">
            AIMS :: Academic Information Management System
            </a>
        </div>
        </nav>
    </div>
    <!-- End Header -->

    <main>

        <section style="background-color: #c9ebff; margin-top: 1%">
            <div
              class="container mt-2"
              style="
                align-items: center;
                justify-content: center;
                text-align: center;
              "
            >
            <section style="background-color: black; margin-top: 0%; padding: 30px; width: 100%; box-sizing: border-box;">
                <div
                  class="container mt-2"
                  style="
                    display: flex;
                    align-items: center;
                    justify-content: space-between;
                  "
            >
                <div style="display: flex; gap: 20px;">
                    <a href="/home" style="text-decoration: none; font-weight: bold;">Home</a>
                    <a href="/create-course" style="text-decoration: none; font-weight: bold;">Create Course</a>
                    <a href="/pending-approvals" style="text-decoration: none; font-weight: bold;">Pending Approvals</a>
                </div>
                <div>
                    <a href="/logout" style="text-decoration: none; font-weight: bold; color: red;">Logout</a>
                </div>
            </section>
            </div>
          </section>
          
          <section id="services" class="services section-bg" style="margin-top: 2%">
            <div class="container" data-aos="fade-up">
              <header class="section-header" style="color: black !important;">
                <h3>My Programs</h3>
                <p>View all the courses being taken by you this semester.</p>
              </header>
          
              <div class="justify-content-center align-items-center">
                <div class="row g-5">
                  {% for course in courses %}
                  <div class="col-md-6 col-lg-4 wow bounceInUp" data-aos="zoom-in" data-aos-delay="100">
                    <a href="" style="text-decoration: none;"> <!-- will add the link of the course page-->
                      <div class="box" style="cursor: pointer;">
                        <div class="icon" style="background: rgb(209, 237, 255)">
                          <i class="bi bi-journal-text" style="color: #1985f0"></i>
                        </div>
                        <h3 class="title" style="text-align: center;">{{course.course_name}}</h3>
                        <h5 style="font-size: small; text-align: center;">Instructor: {{course.instructor_name}}</h5>
                        <h6 style="font-size: small; text-align: center;">LTPC: {{course.course_ltpc}}</h6>
                      </div>
                    </a>
                  </div>
                  {% endfor %}
                </div>
              </div>
            </div>
          </section>
          
        
    </main>
  
      <a
        href="#"
        class="back-to-top d-flex align-items-center justify-content-center"
        ><i class="bi bi-arrow-up-short"></i
      ></a>
  
      <!-- Vendor JS Files -->
      <script src="../static/assets/vendor/purecounter/purecounter_vanilla.js"></script>
      <script src="../static/assets/vendor/aos/aos.js"></script>
      <script src="../static/assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
      <script src="../static/assets/vendor/glightbox/js/glightbox.min.js"></script>
      <script src="../static/assets/vendor/isotope-layout/isotope.pkgd.min.js"></script>
      <script src="../static/assets/vendor/swiper/swiper-bundle.min.js"></script>
      <script src="../static/assets/vendor/php-email-form/validate.js"></script>
  
      <!-- Template Main JS File -->
      <script src="../static/assets/js/main.js"></script>
  
</body>

</html>
