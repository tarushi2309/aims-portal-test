<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />

    <title>Mentify - Signup - Mentor</title>
    <meta content="" name="description" />
    <meta content="" name="keywords" />

    <!-- Favicons -->
    <link href="../static/assets/img/favicon.png" rel="icon" />
    <link href="../static/assets/img/apple-touch-icon.png" rel="apple-touch-icon" />

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css?family=Open+Sans:300,300i,400,400i,600,600i,700,700i|Montserrat:300,400,500,600,700"
      rel="stylesheet"
    />

    <!-- Vendor CSS Files -->
    <link href="../static/assets/vendor/aos/aos.css" rel="stylesheet" />
    <link
      href="../static/assets/vendor/bootstrap/css/bootstrap.min.css"
      rel="stylesheet"

<body class = "bg-light">
  <!-- ======= Header ======= -->
  <div>
    <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
      <div class="container-fluid">
        <a class="navbar-brand AIMS">
          AIMS :: Academic Information Management System
        </a>
      </div>
    </nav>
  <!-- End Header -->
  <section class="bg-light py-3 py-md-5" style="margin: 5%;">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5 col-xxl-4">
          <div class="card border border-light-subtle rounded-3 shadow-sm">
            <div class="card-body p-3 p-md-4 p-xl-5 bg-dark" style="border-radius: 2%;">
              <h5 class=" text-center text-light mb-4" style="font-family: 'Montserrat', sans-serif; font-weight: 400">
                Enter your details to register
              </h5>
              <form id="facultySignupForm" action="/signup" method="post">
                <div class="row gy-2 overflow-hidden">
                    <div class="col-12">
                        <div class="mb-2">
                            <input
                                type="text"
                                class="form-control"
                                name="name"
                                id="fullName"
                                placeholder="Enter Full Name"
                                required
                            />
                        </div>
                    </div>
                    <div class="col-12">
                        <div class="mb-2">
                            <input
                                type="email"
                                class="form-control"
                                name="email"
                                id="email"
                                placeholder="Enter Email"
                                required
                            />
                        </div>
                    </div>
                    <div class="col-12">
                        <div class="mb-2">
                            <input
                                type="text"
                                class="form-control"
                                name="faculty"
                                id="facultyid"
                                placeholder="Enter Faculty ID"
                                required
                            />
                        </div>
                    </div>
                    <div class="col-12">
                      <div class="mb-2">
                          <select class="form-control" name="department" id="department" required>
                              <option value="" disabled selected>Select Department</option>
                              <option value="COMPUTER SCIENCE AND ENGINEERING">Computer Science and Engineering</option>
                              <option value="ELECTRICAL ENGINEERING">Electrical Engineering</option>
                              <option value="MECHANICAL ENGINEERING">Mechanical Engineering</option>
                              <option value="MATHS AND COMPUTING">Maths and Computing</option>
                              <option value="CHEMICAL ENGINEERING">Chemical Engineering</option>
                              <option value="METALLURGY ENGINEERING">Metallurgy Engineering</option>
                              <option value="CIVIL ENGINEERING">Civil Engineering</option>
                              <option value="HUMANITIES AND SOCIAL SCIENCES">Humanities and Social Sciences</option>
                              <!-- Add more options as needed -->
                          </select>
                      </div>
                    </div>
                    <div class="col-12">
                        <div class="d-grid my-3">
                            <button class="btn btn-secondary btn-lg" type="submit">
                                Sign up
                            </button>
                        </div>
                    </div>
                    <div class="col-12">
                        <p class="m-0 text-secondary text-center">
                            Already have an account?
                            <a href="login" class="link-primary text-decoration-none">Log in</a>
                        </p>
                    </div>
                </div>
            </form>

            <div id="successModal" style="display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; border-radius: 8px; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2); z-index: 1000; padding: 20px; text-align: center;">
              <p id="modalMessage" style="font-size: 18px; color: #333;"></p>
              <button onclick="closeModal()" style="margin-top: 15px; padding: 8px 16px; background: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer;">OK</button>
            </div>
            <!-- Modal Overlay -->
            <div id="modalOverlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5); z-index: 999;"></div>
            
            
            <script>
              document.getElementById("facultySignupForm").onsubmit = function (event) {
                const fields = [
                  { id: "fullName", name: "Full Name" },
                  { id: "email", name: "Email" },
                  { id: "facultyid", name: "Faculty ID" },
                  { id: "department", name: "Department" },
                ];
            
                // Validate all fields
                for (let field of fields) {
                  const value = document.getElementById(field.id).value.trim();
                  if (!value) {
                    event.preventDefault(); // Prevent submission
                    showModal(`Please fill out the ${field.name} field.`);
                    document.getElementById(field.id).focus();
                    return false;
                  }
                }
            
                // Show success modal on successful validation
                event.preventDefault(); // Prevent submission for demonstration
                showModal("Registration successful!");
              };
            
              // Function to show the modal
              function showModal(message) {
                const modal = document.getElementById("successModal");
                const overlay = document.getElementById("modalOverlay");
                document.getElementById("modalMessage").textContent = message;
            
                modal.style.display = "block";
                overlay.style.display = "block";
              }
            
              // Function to close the modal
              function closeModal() {
                const modal = document.getElementById("successModal");
                const overlay = document.getElementById("modalOverlay");
            
                modal.style.display = "none";
                overlay.style.display = "none";

                window.location.href = '/';
              }
            </script>
            
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
</body>
