  <section class="bg-light py-3 py-md-5" style="margin: 5%;">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5 col-xxl-4">

              <h5 class=" text-center text-light mb-4" style="font-family: 'Montserrat', sans-serif; font-weight: 400">
                Enter your details to register
              </h5>
              <form action="/signup" method="post">
                <div class="row gy-2 overflow-hidden">
                  <div class="col-12">
                    <div class="mb-2">
                      <input
                        type="text"
                        class="form-control"
                        name="name"
                        id="fullName"
                        placeholder="Enter Full Name"
                        required
                      />
                      <!-- <label for="firstName" class="form-label"
                        >Full Name</label
                      > -->
                    </div>
                  </div>
                  <div class="col-12">
                    <div class="mb-2">
                      <input
                        type="email"
                        class="form-control"
                        name="email"
                        id="email"
                        placeholder="Enter Email"
                        required
                      />
                      <!-- <label for="email" class="form-label">Email</label> -->
                    </div>
                  </div>
                  <div class="col-12">
                    <div class="mb-2">
                      <input
                        type="text"
                        class="form-control"
                        name="faculty"
                        id="facultyid"
                        placeholder="Enter Faculty ID"
                        required
                      />
                      <!-- <label for="email" class="form-label">Email</label> -->
                    </div>
                  </div>
                  <div class="col-12">
                    <div class="mb-2">
                      <input
                        type="text"
                        class="form-control"
                        name="department"

                      />
                      <!-- <label for="email" class="form-label">Email</label> -->
                    </div>
                  </div>
