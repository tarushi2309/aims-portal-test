  <!-- Registration 13 - Bootstrap Brain Component -->
  <section class="bg-light py-3 py-md-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5 col-xxl-4">
          <div class="card border border-light-subtle rounded-3 shadow-sm">
            <div class="card-body p-3 p-md-4 p-xl-5 bg-dark" style="border-radius: 2%;">
              <h5 class=" text-center text-light mb-4" style="font-family: 'Montserrat', sans-serif; font-weight: 400">
                Enter your details to register
              </h5>
              <form action="/signup" method="post">
                <div class="row gy-2 overflow-hidden">
                  <div class="col-12">
                    <div class="mb-2">
                      <input
                        type="text"
                        class="form-control"
                        name="name"
                        id="fullName"
                        placeholder="Full Name"
                        required
                      />
                      <!-- <label for="firstName" class="form-label"
                        >Full Name</label
                      > -->
                    </div>
                  </div>
                  <div class="col-12">
                    <div class="mb-2">
                      <input
                        type="email"
                        class="form-control"
                        name="email"
                        id="email"
                        placeholder="Email"
                        required
                      />
                      <!-- <label for="email" class="form-label">Email</label> -->
                    </div>
                  </div>
                  <div class="col-12">
                    <div class="mb-2">
                      <input
                        type="text"
                        class="form-control"
                        name="entry_no"
                        id="EntryNo"
                        placeholder="Entry Number"
                        required
                      />
                      <!-- <label for="email" class="form-label">Email</label> -->
                    </div>
                  </div>
                  <div class="col-12">
                    <div class="mb-2">
                      <select class="form-control" name="degree" id="degree" required>
                        <option value="" disabled selected>Select Degree Type</option>
                        <option value="BTECH">B Tech</option>
                        <option value="MTECH">M Tech</option>
                        <!-- Add more options as needed -->
                      </select>
                    </div>
                  </div>
                  <div class="col-12">
                    <div class="mb-2">
                      <select class="form-control" name="department" id="department" required>
                        <option value="" disabled selected>Select Department</option>
                            <option value="COMPUTER SCIENCE AND ENGINEERING">COMPUTER SCIENCE AND ENGINEERING</option>
                            <option value="ELECTRICAL ENGINEERING">ELECTRICAL ENGINEERING</option>
                            <option value="MECHANICAL ENGINEERING">MECHANICAL ENGINEERING</option>
                            <option value="MATHS AND COMPUTING">MATHS AND COMPUTING</option>
                            <option value="CHEMICAL ENGINEERING">CHEMICAL ENGINEERING</option>
                            <option value="METALLURGY ENGINEERING">METALLURGY ENGINEERING</option>
                            <option value="CIVIL ENGINEERING">CIVIL ENGINEERING</option>
                            <option value="HUMANITIES AND SOCIAL SCIENCES">HUMANITIES AND SOCIAL SCIENCES</option>
                        <!-- Add more options as needed -->
                      </select>
                    </div>
                  </div>
                  <div class="col-12">
                    <div class="mb-2">
                      <input
                        type="text"
                        class="form-control"
                        name="year_of_entry"
                        id="year"
                        placeholder="Year of Entry"
                        required
                      />
                      <!-- <label for="email" class="form-label">Email</label> -->
                    </div>
                  </div>
                  </div>
                  <div class="col-12">
                    <div class="d-grid my-3">
                      <button class="btn btn-secondary btn-lg" type="submit">
                        Sign up
                      </button>
                    </div>
                  </div>
                  <div class="col-12">
                    <p class="m-0 text-secondary text-center">
                      Already have an account?
                      <a href="login" class="link-primary text-decoration-none"
                        >Log in</a
                      >
                    </p>
                  </div>
                </div>
              </form>

              <script>
                document.getElementById("signupForm").onsubmit = function (event) {
                // Prevent form submission if validation fails
                  const fields = [
                      { id: "fullName", name: "Full Name" },
                      { id: "email", name: "Email" },
                      { id: "EntryNo", name: "Entry Number" },
                      { id: "degree", name: "Degree Type" },
                      { id: "department", name: "Department" },
                      { id: "year", name: "Year of Entry" },
                  ];

                  for (let field of fields) {
                      const value = document.getElementById(field.id).value.trim();
                      if (!value) {
                          event.preventDefault(); // Prevent submission
                          alert(`Please fill out the ${field.name} field.`);
                          document.getElementById(field.id).focus();
                          return false;
                      }
                  }

                // Show success message after successful submission
                  alert("Registration successful! You can login once admin approvals the registration.");
                  this.submit()
                };
              </script>
            </div>
          </div>
        </div>
      </div>
    </div>
